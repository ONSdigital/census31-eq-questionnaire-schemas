services:
  ajv-validator:
    image: ghcr.io/onsdigital/census31-eq-questionnaire-validator-ajv:pr-5-update-ajv-port-to-5006 # Revert after testing
    networks:
      - eq-schema
    ports:
      - 5006:5006
    healthcheck:
      test: "curl localhost:5006/status"
      interval: 5s
      timeout: 5s
      retries: 20

  py-validator:
    image: ghcr.io/onsdigital/census31-eq-questionnaire-validator:${TAG}
    networks:
      - eq-schema
    environment:
      AJV_VALIDATOR_HOST: ajv-validator
      AJV_VALIDATOR_PORT: 5006 # Revert after testing
    ports:
      - 5001:5000
    depends_on:
      ajv-validator:
        condition: service_healthy
networks:
  eq-schema:
    driver: bridge

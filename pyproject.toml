[tool.poetry]
name = "eq-questionnaire-schemas"
version = "0.1.0"
description = "Census Questionnaire Schemas Repository"
authors = ["ONSDigital"]

[tool.poetry.dependencies]
python = "^3.13"
coloredlogs = "*"
eq-translations = {git = "https://github.com/ONSDigital/eq-translations.git", rev = "v4.10.3"}
idna = ">=3.15"

[tool.poetry.group.dev.dependencies]
black = "*"
isort = "*"
pylint = "*"
flake8-quotes = "*"
jsonpointer = "*"
click = ">=8.3.3"
setuptools = ">=83.0.0"
jsonpath-rw = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

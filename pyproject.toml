[tool.poetry]
name = "eq-questionnaire-schemas"
version = "0.1.0"
description = "Census Questionnaire Schemas Repository"
authors = ["ONSDigital"]

[tool.poetry.dependencies]
python = "^3.13"
coloredlogs = "^15.0.1"
idna = ">=3.20"
babel = "==2.14.0"  # Temporarily pinned - problem for translations found in v2.15.0, see: https://github.com/ONSdigital/eq-questionnaire-runner/pull/1
jsonpointer = "^3.4"
tqdm = "^4.70.1"
requests = "^2.34.2"
termcolor = "^3.3.0"
jsonpath-ng = "1.10.0"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
isort = "^9.0.2"
pylint = "^4.1.3"
flake8-quotes = "^3.4.0"
jsonpointer = "^3.4"
click = ">=8.5.0"
setuptools = ">=84.2.1"
jsonpath-rw = "^1.4.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
